rules:
  - id: CPG2-GV-01
    title: Assign a named cybersecurity owner with leadership visibility
    function: GOVERN
    summary: Someone accountable for cyber risk reports to the board, council, or plant superintendent.
    nist_csf: ["GV.RR-01", "GV.RR-02"]
    overlays: ["CPG 2.0 GOVERN"]
    cost: low
    impact: high
    ease: high
    ot_weight: 1.1
    remediation:
      - Name a primary and backup cyber owner in writing (superintendent plus IT/OT lead is enough for a small utility).
      - Add a quarterly one-page brief to the existing board or city-council packet.
      - Do not create a new bureaucracy; reuse existing safety-meeting cadence.
    checks:
      - id: role-assigned
        type: policy_true
        field: governance.cyber_role_assigned
        fail_message: No named cybersecurity owner is evidenced
      - id: leadership-briefed
        type: policy_true
        field: governance.board_or_council_briefed
        fail_message: Leadership has not been briefed on cyber risk

  - id: CPG2-GV-02
    title: Hold managed service providers to written security clauses
    function: GOVERN
    summary: Vendors who remote into OT or IT must be logged, constrained, and contractually obligated.
    nist_csf: ["GV.SC-04", "GV.SC-07"]
    mitre_ics: ["T0866"]
    overlays: ["CPG 2.0 GOVERN", "MSP risk"]
    cost: medium
    impact: high
    ease: medium
    ot_weight: 1.3
    remediation:
      - Add remote-access logging and after-hours notification to the integrator contract.
      - Disable persistent vendor VPN accounts; issue time-bound access per work order.
      - Review who can change PLC logic; require dual control for safety-critical writes.
    checks:
      - id: msp-clauses
        type: policy_true
        field: governance.msp_contract_security_clauses
        fail_message: MSP or integrator contract lacks security clauses
      - id: vendor-access-logged
        type: policy_true
        field: governance.vendor_remote_access_logged
        fail_message: Vendor remote access is not logged

  - id: CPG2-GV-03
    title: Review privileged access at least annually
    function: GOVERN
    summary: Least privilege is a governance outcome, not only a technical control.
    nist_csf: ["GV.OC-05", "PR.AA-05"]
    overlays: ["CPG 2.0 GOVERN", "least privilege"]
    cost: low
    impact: medium
    ease: high
    remediation:
      - Export account lists from AD, SCADA, and VPN; mark shared and unused accounts.
      - Disable unused accounts in a change window; replace shared logins with named accounts where the vendor allows it.
    checks:
      - id: least-privilege-review
        type: policy_true
        field: governance.least_privilege_review
        fail_message: No least-privilege or account review is evidenced
      - id: no-shared-accounts
        type: accounts_field
        field: shared
        expected: false
        fail_message: Shared or unnamed accounts remain active
