name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Generate project SBOM stub and impact snapshot
        run: python scripts/release_artifacts.py --out dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicbaseline-release-notes
          path: dist/
      # Maintainers: add `cosign sign-blob` / Sigstore here when publishing GitHub Releases.
      # See docs/en/release-and-signing.md
